<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#181512">
  <title>{{TITLE}}</title>
  <meta name="description" content="2026 共響共享音樂會・12 月 20 日 {{SHOW_TIME}}・{{VENUE}}。{{DESCRIPTION}}">
  <link rel="icon" href="assets/piano.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&amp;family=Noto+Serif+TC:wght@500;600&amp;display=swap">
  <link rel="stylesheet" href="styles.css?v=typography"><script src="main.js" defer></script><script src="background-music.js" defer></script>
</head>
<body id="top">
  <a class="skip" href="{{SKIP_TARGET}}">跳至主要內容</a>
  <div class="background-music" role="group" aria-label="背景音樂" hidden>
    <audio src="assets/program-notes.mp3" loop muted preload="metadata"></audio>
    <button type="button" class="music-toggle" aria-label="開啟背景音樂" title="開啟背景音樂">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M4 10v4m4-7v10m4-13v16m4-12v8m4-6v4"/>
        <path class="equalizer-slash-gap" d="M3 3l18 18"/>
        <path class="equalizer-slash" d="M3 3l18 18"/>
      </svg>
    </button>
    <label class="music-volume">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M3 9h4l5-4v14l-5-4H3z"/>
        <path class="speaker-waves" d="M15 9a4 4 0 0 1 0 6m3-9a8 8 0 0 1 0 12"/>
        <path class="speaker-muted" d="m16 10 4 4m0-4-4 4"/>
      </svg>
      <input type="range" min="0" max="100" value="30" aria-label="背景音樂音量">
      <span aria-hidden="true">30%</span>
    </label>
  </div>
  <main>
    <section class="invitation" id="concert" aria-labelledby="title">
      <div class="invitation-copy">
        <p class="invitation-edition">2026 鋼琴成果發表會</p>
        <h1 id="title">共響共享</h1>
        <p class="invitation-note">誠摯邀請您，<br>與我們共度一個有琴聲相伴的午後。</p>
      </div>
      <div class="event-strip"><div><span class="meta-label">日期</span><p>12.20 <small>2026・星期日</small></p></div><div><span class="meta-label">時間</span><p class="event-time"><time datetime="{{DOORS}}">{{DOORS}}</time> <small>入場</small></p><p class="event-time"><time datetime="{{SHOW_TIME}}">{{SHOW_TIME}}</time> <small>開演</small></p></div><div><span class="meta-label">地點</span><p class="venue">{{VENUE}}<a class="venue-facebook" href="https://www.facebook.com/hehe.ensemble/" target="_blank" rel="noopener noreferrer" aria-label="禾禾文化空間 Facebook（另開新分頁）"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M22 12a10 10 0 1 0-11.56 9.88v-6.99H7.9V12h2.54V9.8c0-2.51 1.49-3.9 3.77-3.9 1.09 0 2.23.2 2.23.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56V12h2.78l-.45 2.89h-2.33v6.99A10 10 0 0 0 22 12Z"/></svg></a></p><address class="venue-address">{{ADDRESS}}</address></div></div>
      <details class="play-piano" hidden>
        <summary>輕觸琴鍵，聽見共鳴</summary>
        <div class="keyboard" role="group" aria-label="可演奏琴鍵，中央 C4"></div>
      </details>
    </section>
    <div class="page-content">
      <nav class="site-nav" id="pages" aria-label="網站導覽">
        <a href="./#pages" data-page="program"{{PROGRAM_CURRENT}}>節目單</a>
        <a href="traffic.html#pages" data-page="traffic"{{TRAFFIC_CURRENT}}>交通資訊</a>
      </nav>
{{CONTENT}}
    </div>
  </main>
  <footer><span>共響共享 · 2026</span><span>12.20 / 禾禾文化空間</span></footer><div class="toast" role="status" aria-live="polite"></div>
{{SHORTCUT}}
</body>
</html>
